    async function uploadWorkouts() {
        const btn = document.getElementById('btn-upload');
        const status = document.getElementById('status');
        btn.disabled = true;
        status.innerText = "⏳ Uploading...";
        status.className = "";

        try {
            let count = 0;
            for (const workoutObj of workoutsData) {
                const workoutId = workoutObj.workout.id.toString();
                await setDoc(doc(db, "workoutsOfficial", "workout_" + workoutId), workoutObj);
                count++;
            }
            status.innerText = `✅ Success! Uploaded ${count} workouts.`;
            status.className = "success";
        } catch (error) {
            console.error(error);
            status.innerText = "❌ Error uploading. Check console.";
            status.className = "error";
        } finally {
            btn.disabled = false;
        }
    }

    async function fetchExerciseNames() {
        const listElement = document.getElementById('exercise-list');
        try {
            const querySnapshot = await getDocs(collection(db, "exercises"));
            listElement.innerHTML = "";
            if (querySnapshot.empty) {
                listElement.innerHTML = "<li>No exercises found in 'exercises' collection.</li>";
                return;
            }
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement('li');
                li.textContent = data.name || "Unnamed Exercise";
                listElement.appendChild(li);
            });
        } catch (error) {
            console.error(error);
            listElement.innerHTML = "<li>Error loading exercises.</li>";
        }
    }

    document.getElementById('btn-upload').addEventListener('click', uploadWorkouts);
    fetchExerciseNames();
</script>
